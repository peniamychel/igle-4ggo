<div class="container">
  <div class="nuevo-buscar">
    <button mat-raised-button color="primary" (click)="openCreateDialog()" *appHasPrivilegio="'Escribir Certificados'">
      <mat-icon>add</mat-icon>
      Nuevo Tipo de Certificado
    </button>
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Bautismo" #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
  <mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="nombre">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</mat-header-cell>
      <mat-cell *matCellDef="let item">{{ item.nombre }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</mat-header-cell>
      <mat-cell *matCellDef="let item">{{ item.fecha | date:'dd/MM/yyyy' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="estado">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Estado</mat-header-cell>
      <mat-cell *matCellDef="let item">
        <span class="estado-badge" [ngClass]="item.estado ? 'activo' : 'inactivo'">
          {{ item.estado ? 'Activo' : 'Inactivo' }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
      <mat-cell *matCellDef="let item" class="acciones-cell">
        <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="openEditDialog(item)" *appHasPrivilegio="'Escribir Certificados'">
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>
          <button mat-menu-item (click)="toggleEstado(item)" *appHasPrivilegio="'Escribir Certificados'">
            <mat-icon>{{ item.estado ? 'check_circle' : 'cancel' }}</mat-icon>
            <span>{{ item.estado ? 'Desactivar' : 'Activar' }}</span>
          </button>
        </mat-menu>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openDetailDialog(row)" class="clickable-row"></mat-row>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">
        <app-loading-spinner *ngIf="isLoading" message="Cargando..."></app-loading-spinner>
        <span *ngIf="!isLoading">No se encontraron datos que coincidan con "{{ input.value }}"</span>
      </td>
    </tr>
  </mat-table>

  <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Seleccionar página de tipos de certificado">
  </mat-paginator>
  </div>
</div>
