<h2 mat-dialog-title>
  <mat-icon class="title-icon">edit</mat-icon>
  Editar Tipo Ministerio
</h2>

<form [formGroup]="tipoCargoForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <input matInput formControlName="tipo" placeholder="Ej. Pastor">
      <mat-error>{{ getError('tipo') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre del Ministerio</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Pastor responsable de Iglesia">
      <mat-error>{{ getError('nombre') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol del Sistema</mat-label>
      <input matInput formControlName="nombreRol" placeholder="Ej. ADMIN">
      <mat-hint>Identificador interno del rol (sin espacios, mayúsculas)</mat-hint>
      <mat-error>{{ getError('nombreRol') }}</mat-error>
    </mat-form-field>

    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close type="button">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!tipoCargoForm.valid">
        <mat-icon>save</mat-icon>
        Guardar
      </button>
    </mat-dialog-actions>

  </mat-dialog-content>
</form>
