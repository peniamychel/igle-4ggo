<div class="container">
  <!-- Contenedor pegajoso para cabecera y filtros -->
  <div class="sticky-header">
    <div class="header-section">
      <div class="title-wrapper">
        <div class="title-icon-circle">
          <mat-icon class="header-icon">category</mat-icon>
        </div>
        <div>
          <h2>Tipos de Evento</h2>
          <p class="subtitle">{{ dataSource.filteredData.length }} registros</p>
        </div>
      </div>
      <div class="header-actions" *appHasPrivilegio="'Escribir Eventos'">
        <button mat-flat-button class="btn-new-item" matTooltip="Crear un nuevo tipo de evento" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          Nuevo Tipo
        </button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input type="text" (keyup)="applyFilter($event)" placeholder="Buscar por nombre..." #input>
      </div>
    </div>
  </div>

  <div class="table-container">
    <mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="nombre">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</mat-header-cell>
        <mat-cell *matCellDef="let item" class="nombre-cell">{{ item.nombre }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="estado">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Estado</mat-header-cell>
        <mat-cell *matCellDef="let item">
          <span class="estado-pill" [ngClass]="item.estado ? 'activo' : 'inactivo'">
            {{ item.estado ? 'Activo' : 'Inactivo' }}
          </span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
        <mat-cell *matCellDef="let item" class="acciones-cell">
          <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="openDetailDialog(item)">
              <mat-icon>visibility</mat-icon>
              <span>Ver detalle</span>
            </button>
            <button mat-menu-item *appHasPrivilegio="'Escribir Eventos'" (click)="openEditDialog(item)">
              <mat-icon>edit</mat-icon>
              <span>Editar</span>
            </button>
            <button mat-menu-item *appHasPrivilegio="'Escribir Eventos'" (click)="toggleEstado(item)">
              <mat-icon>{{ item.estado ? 'cancel' : 'check_circle' }}</mat-icon>
              <span>{{ item.estado ? 'Desactivar' : 'Activar' }}</span>
            </button>
            <button mat-menu-item *appHasPrivilegio="'Escribir Eventos'" (click)="deleteTipoEvento(item)">
              <mat-icon style="color: #dc3545;">delete</mat-icon>
              <span style="color: #dc3545; font-weight: 500;">Eliminar</span>
            </button>
          </mat-menu>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openDetailDialog(row)" class="clickable-row"></mat-row>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" colspan="3">
          <div class="no-results">
            <mat-icon>search_off</mat-icon>
            <span>No se encontraron datos que coincidan con la búsqueda.</span>
          </div>
        </td>
      </tr>
    </mat-table>

    <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Seleccionar página de tipos de evento">
    </mat-paginator>
  </div>
</div>
