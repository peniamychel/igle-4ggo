<h2 mat-dialog-title>Registrar Traspaso de Miembro</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-container">
      <mat-form-field appearance="outline">
        <mat-label>Nueva Iglesia</mat-label>
        <mat-select formControlName="iglesiaId">
          <mat-option *ngFor="let iglesia of iglesias" [value]="iglesia.id">
            {{iglesia.nombre}} - {{iglesia.direccion}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('iglesiaId')?.hasError('required')">
          Seleccione una iglesia
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Motivo del Traspaso</mat-label>
        <textarea matInput formControlName="motivoTraspaso" rows="3"></textarea>
        <mat-error *ngIf="form.get('motivoTraspaso')?.hasError('required')">
          El motivo es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fecha de Traspaso</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fechaTraspaso">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('fechaTraspaso')?.hasError('required')">
          La fecha es requerida
        </mat-error>
      </mat-form-field>

      <div class="file-upload-container">
        <button type="button" mat-stroked-button (click)="fileInput.click()">
          <mat-icon>upload_file</mat-icon> Seleccionar Carta de Traspaso
        </button>
        <input #fileInput type="file" style="display: none;" (change)="onFileSelected($event)" accept="image/*,application/pdf">
        <span class="file-name" *ngIf="selectedFileName" style="display: flex; align-items: center; gap: 4px;">
          <mat-icon style="font-size: 18px; width: 18px; height: 18px; color: #00875a;">check_circle</mat-icon>
          {{selectedFileName}}
        </span>
        <input type="hidden" formControlName="uriCartaTraspaso">
        <mat-error *ngIf="form.get('uriCartaTraspaso')?.hasError('required') && form.get('uriCartaTraspaso')?.touched" style="font-size: 0.75rem; margin-top: -4px; color: #f44336;">
          La carta de traspaso es requerida
        </mat-error>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">
      Registrar Traspaso
    </button>
  </mat-dialog-actions>
</form>
